name: Validate Netflix DE Portfolio Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate repository structure and notebooks
        run: |
          python scripts/validate_project.py

      - name: Run unit checks
        run: |
          pytest -q

      - name: Validation summary
        run: |
          echo "Structure validation and unit tests passed."
          echo "Note: Azure cloud resources (ADF, ADLS Gen2, Databricks) are decommissioned."
          echo "All pipeline code and documentation are preserved for portfolio purposes."